<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Fotos da Barbearia</title>
    <style>
        .galeria {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
    padding: 20px;
}

.galeria img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 10px;
    transition: 0.3s;
}

.galeria img:hover {
    transform: scale(1.05);
}

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f2f2f2;
        overflow-x: hidden;
    }

    nav {
        background: #222;
        padding: 12px;
        text-align: center;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    nav a {
        color: white;
        margin: 0 20px;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
    }

    nav a:hover {
        color: #ffcc00;
        transform: scale(1.1);
    }
</style>

</nav>

</div>
